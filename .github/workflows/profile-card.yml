name: Refresh profile card

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["assets/**", "tools/**", ".github/workflows/profile-card.yml"]

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # The default token sees public data; add a STATS_TOKEN secret (read:user) to count private contributions.
      - name: Fetch stats
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/fetch_stats.py

      - name: Build SVGs
        run: |
          python tools/build_card.py
          python tools/build_links.py
          python tools/build_pacman.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.svg' cache/
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile card"
          git pull --rebase origin main
          git push
